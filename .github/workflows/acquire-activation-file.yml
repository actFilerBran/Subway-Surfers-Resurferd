name: Extract ULF without Hub
on:
  workflow_dispatch:

jobs:
  get-license:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2019.4.40f1-base-1
    steps:
      - name: Activate Unity via CLI
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics -quit \
            -username "${{ secrets.UNITY_EMAIL }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -logFile /dev/stdout || true

      - name: Find and upload ULF
        uses: actions/upload-artifact@v4
        with:
          name: unity-license
          path: /root/.local/share/unity3d/Unity/Unity_lic.ulf

          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
